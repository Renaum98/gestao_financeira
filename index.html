<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <!-- Evita que o index.html seja servido do cache HTTP do navegador.
       Sem isso, o SW novo nunca é descoberto em PWAs instalados. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Gerencie seus gastos, entradas, orçamentos e metas de poupança com gráficos claros e tour guiado." />
  <meta name="theme-color" content="#6E4FF6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyCounts" />
  <title>MyCounts</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Faixa de pesos (400..800) e não a lista (400;500;600;700;800): a lista faz
       o Google servir cinco fontes estáticas, a faixa serve UMA fonte variável
       que cobre os cinco. Todos são usados de verdade na UI, então o caminho não
       é cortar peso — é parar de baixar cinco arquivos numa conexão ruim. -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
