<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Loader preview</title>
<style>
  :root {
    --bg: #FBF7F2;
    --primary: #6E4FF6;
    --primary-2: #8C72FF;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    font-family: system-ui, sans-serif;
  }
  .row { display: flex; gap: 48px; align-items: center; }
  .label { font-size: 12px; color: #8A7F84; text-align: center; }

  /* Loader CSS (copiado de styles.css) */
  .finca-loader {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .finca-loader__blob {
    width: 100%;
    height: 100%;
    background:
      radial-gradient(
        circle at 38% 35%,
        color-mix(in oklab, var(--primary-2) 88%, white) 0%,
        var(--primary) 48%,
        color-mix(in oklab, var(--primary) 60%, black) 100%
      );
    box-shadow:
      0 12px 28px color-mix(in oklab, var(--primary) 30%, transparent),
      inset 0 -6% 14% color-mix(in oklab, var(--primary) 50%, black),
      inset 0 4% 12% color-mix(in oklab, white 22%, transparent);
    position: relative;
    overflow: hidden;
    animation: fincaLoaderMorph 5.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    will-change: border-radius, transform;
  }
  .finca-loader__blob::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at 28% 22%,
      rgba(255, 255, 255, 0.32),
      transparent 55%
    );
    pointer-events: none;
  }
  .finca-loader__blob::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at 50% 55%,
      transparent 50%,
      rgba(0, 0, 0, 0.22) 100%
    );
    pointer-events: none;
  }
  @keyframes fincaLoaderMorph {
    0%   { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%;
           transform: scale(0.92) rotate(0deg); }
    14%  { border-radius: 78% 22% 64% 36% / 40% 76% 24% 60%;
           transform: scale(1.10) rotate(14deg); }
    28%  { border-radius: 22% 78% 30% 70% / 72% 26% 74% 28%;
           transform: scale(0.88) rotate(-12deg); }
    42%  { border-radius: 60% 40% 78% 22% / 26% 70% 30% 74%;
           transform: scale(1.12) rotate(-18deg); }
    56%  { border-radius: 36% 64% 22% 78% / 78% 24% 76% 22%;
           transform: scale(0.86) rotate(16deg); }
    70%  { border-radius: 70% 30% 56% 44% / 30% 72% 28% 70%;
           transform: scale(1.08) rotate(22deg); }
    85%  { border-radius: 26% 74% 64% 36% / 60% 32% 68% 40%;
           transform: scale(0.94) rotate(-6deg); }
    100% { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%;
           transform: scale(0.92) rotate(0deg); }
  }

  /* Para "congelar" cada amostra num momento diferente do ciclo */
  .frame { animation-play-state: paused !important; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="finca-loader" style="width: 220px; height: 220px;">
        <div class="finca-loader__blob"></div>
      </div>
      <div class="label" style="margin-top: 12px;">Animação ao vivo</div>
    </div>
  </div>

  <!-- Frames congelados em pontos-chave do ciclo (delay negativo) -->
  <div class="row">
    <div>
      <div class="finca-loader" style="width: 110px; height: 110px;">
        <div class="finca-loader__blob frame" style="animation-delay: 0s;"></div>
      </div>
      <div class="label" style="margin-top: 8px;">0%</div>
    </div>
    <div>
      <div class="finca-loader" style="width: 110px; height: 110px;">
        <div class="finca-loader__blob frame" style="animation-delay: -0.51s;"></div>
      </div>
      <div class="label" style="margin-top: 8px;">15%</div>
    </div>
    <div>
      <div class="finca-loader" style="width: 110px; height: 110px;">
        <div class="finca-loader__blob frame" style="animation-delay: -1.02s;"></div>
      </div>
      <div class="label" style="margin-top: 8px;">30%</div>
    </div>
    <div>
      <div class="finca-loader" style="width: 110px; height: 110px;">
        <div class="finca-loader__blob frame" style="animation-delay: -1.53s;"></div>
      </div>
      <div class="label" style="margin-top: 8px;">45%</div>
    </div>
    <div>
      <div class="finca-loader" style="width: 110px; height: 110px;">
        <div class="finca-loader__blob frame" style="animation-delay: -2.04s;"></div>
      </div>
      <div class="label" style="margin-top: 8px;">60%</div>
    </div>
    <div>
      <div class="finca-loader" style="width: 110px; height: 110px;">
        <div class="finca-loader__blob frame" style="animation-delay: -2.65s;"></div>
      </div>
      <div class="label" style="margin-top: 8px;">78%</div>
    </div>
  </div>
</body>
</html>
